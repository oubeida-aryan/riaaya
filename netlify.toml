[build]
    command = "npm run build"
    publish = "www"

[context.production]
    ignore = ["secure_admin", "admin.html", "admin.js", "*.sql"]

[headers]
    for = "/*"
    [headers.values]
        X-Frame-Options = "DENY"
        X-Content-Type-Options = "nosniff"
        Cache-Control = "no-cache, no-store, must-revalidate"
        Pragma = "no-cache"
        Expires = "0"
        Content-Security-Policy = "default-src 'self' 'unsafe-inline' 'unsafe-eval' https://*.supabase.co https://*.google.com https://fonts.googleapis.com https://fonts.gstatic.com https://cdnjs.cloudflare.com https://api.whatsapp.com https://unpkg.com data: blob: gap:;"

[[redirects]]
    from = "/*"
    to = "/index.html"
    status = 200
