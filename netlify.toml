[build]
    command = "node build.js"
    publish = "."

[[headers]]
    for = "/sw.js"
    [headers.values]
        Cache-Control = "no-cache, no-store, must-revalidate"
        Service-Worker-Allowed = "/"

[[headers]]
    for = "/*.js"
    [headers.values]
        Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
    for = "/*.css"
    [headers.values]
        Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
    for = "/icons/*"
    [headers.values]
        Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
    for = "/*"
    [headers.values]
        X-Frame-Options = "DENY"
        X-Content-Type-Options = "nosniff"
        Cache-Control = "no-cache, no-store, must-revalidate"
        Pragma = "no-cache"
        Expires = "0"
        Content-Security-Policy = "default-src 'self' 'unsafe-inline' 'unsafe-eval' https://*.supabase.co https://*.google.com https://fonts.googleapis.com https://fonts.gstatic.com https://cdnjs.cloudflare.com https://api.whatsapp.com https://unpkg.com https://cdn.jsdelivr.net data: blob: gap:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: https: blob:; connect-src 'self' https://*.supabase.co https://api.whatsapp.com;"

[[redirects]]
    from = "/*"
    to = "/index.html"
    status = 200
