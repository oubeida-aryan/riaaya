<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Riaaya Admin Panel | لوحة التحكم</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: var(--light-gray);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .admin-container {
            width: 100%;
            max-width: 100%;
            margin: 0;
            padding: 20px;
        }

        .admin-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--light-gray);
            padding-bottom: 10px;
            background: var(--white);
            padding: 15px 20px;
            border-radius: 10px 10px 0 0;
        }

        .admin-tab {
            padding: 12px 24px;
            background: none;
            border: none;
            border-bottom: 3px solid transparent;
            color: #636e72;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 16px;
        }

        .admin-tab.active {
            color: var(--primary);
            border-bottom: 3px solid var(--primary);
            background: rgba(0, 184, 148, 0.1);
        }

        .admin-section {
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .admin-section.active {
            display: block;
        }

        .data-table {
            width: 100%;
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: var(--shadow);
        }

        .table-header {
            background: var(--primary);
            color: white;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .table-header h3 {
            margin: 0;
            font-size: 20px;
        }

        .table-content {
            max-height: 500px;
            overflow-y: auto;
        }

        .data-row {
            padding: 20px 30px;
            border-bottom: 1px solid var(--light-gray);
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.3s;
        }

        .data-row:hover {
            background: rgba(0, 184, 148, 0.05);
        }

        .pending-row {
            background-color: #fff9db;
        }

        .status-badge {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .status-active {
            background: #d1fae5;
            color: #065f46;
        }

        .status-pending {
            background: #fef3c7;
            color: #92400e;
        }

        .data-info {
            flex: 1;
        }

        .data-info strong {
            font-size: 16px;
            color: var(--text);
        }

        .data-info small {
            color: #636e72;
            font-size: 14px;
        }

        .data-actions {
            display: flex;
            gap: 10px;
        }

        .btn-edit,
        .btn-delete {
            padding: 10px 15px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .btn-edit {
            background: var(--secondary);
            color: white;
        }

        .btn-edit:hover {
            background: #0770c4;
            transform: translateY(-2px);
        }

        .btn-delete {
            background: var(--accent);
            color: white;
        }

        .btn-delete:hover {
            background: #d63031;
            transform: translateY(-2px);
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--text);
            font-size: 14px;
        }

        .form-group input,
        .form-group select {
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(0, 184, 148, 0.1);
        }

        .btn-add {
            background: var(--primary);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-add:hover {
            background: #00a085;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(0, 184, 148, 0.3);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(5px);
        }

        .modal-content {
            background: white;
            padding: 40px;
            border-radius: 15px;
            width: 90%;
            max-width: 600px;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            animation: slideUp 0.3s ease;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .modal-header h3 {
            margin: 0;
            color: var(--text);
            font-size: 22px;
        }

        .close-modal {
            background: none;
            border: none;
            font-size: 28px;
            cursor: pointer;
            color: #636e72;
            transition: color 0.3s;
        }

        .close-modal:hover {
            color: var(--accent);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: var(--shadow);
            text-align: center;
            transition: transform 0.3s;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }

        .stat-number {
            font-size: 42px;
            font-weight: bold;
            color: var(--primary);
            margin-bottom: 10px;
        }

        .stat-label {
            color: #636e72;
            font-size: 16px;
            font-weight: 500;
        }

        .header {
            background: var(--white);
            padding: 25px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--light-gray);
            border-radius: 10px 10px 0 0;
        }

        .header h2 {
            margin: 0;
            color: var(--text);
            font-size: 28px;
        }

        .btn-text {
            background: transparent;
            border: 2px solid var(--accent);
            color: var(--accent);
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s;
        }

        .btn-text:hover {
            background: var(--accent);
            color: white;
        }

        /* Wide screen optimizations */
        @media (min-width: 1200px) {
            .form-grid {
                grid-template-columns: repeat(3, 1fr);
            }

            .stats-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }
    </style>
</head>

<body>
    <div class="admin-container">
        <div class="header">
            <h2>لوحة التحكم / Admin Panel</h2>
            <button onclick="logout()" class="btn-text">Logout</button>
        </div>

        <!-- Statistics -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-number" id="total-services">0</div>
                <div class="stat-label">الخدمات / Services</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="total-nurses">0</div>
                <div class="stat-label">الممرضين / Nurses</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="total-materials">0</div>
                <div class="stat-label">المعدات / Materials</div>
            </div>
        </div>

        <div class="admin-tabs">
            <button class="admin-tab active" onclick="switchAdminTab(event, 'services')">الخدمات / Services</button>
            <button class="admin-tab" onclick="switchAdminTab(event, 'nurses')">الممرضين / Nurses</button>
            <button class="admin-tab" onclick="switchAdminTab(event, 'materials')">المعدات / Materials</button>
        </div>

        <!-- Services Section -->
        <div id="services-section" class="admin-section active">
            <div class="data-table">
                <div class="table-header">
                    <h3>إدارة الخدمات / Manage Services</h3>
                    <button class="btn-add" onclick="openServiceModal()">
                        <i class="fa-solid fa-plus"></i> إضافة خدمة
                    </button>
                </div>
                <div class="table-content" id="services-list">
                    <!-- Services will be populated here -->
                </div>
            </div>
        </div>

        <!-- Nurses Section -->
        <div id="nurses-section" class="admin-section">
            <div class="data-table">
                <div class="table-header">
                    <h3>إدارة الممرضين / Manage Nurses</h3>
                    <button class="btn-add" onclick="openNurseModal()">
                        <i class="fa-solid fa-plus"></i> إضافة ممرض
                    </button>
                </div>
                <div class="table-content" id="nurses-list">
                    <!-- Nurses will be populated here -->
                </div>
            </div>
        </div>

        <!-- Materials Section -->
        <div id="materials-section" class="admin-section">
            <div class="data-table">
                <div class="table-header">
                    <h3>إدارة المعدات / Manage Materials</h3>
                    <button class="btn-add" onclick="openMaterialModal()">
                        <i class="fa-solid fa-plus"></i> إضافة مادة
                    </button>
                </div>
                <div class="table-content" id="materials-list">
                    <!-- Materials will be populated here -->
                </div>
            </div>
        </div>
    </div>

    <!-- Service Modal -->
    <div id="service-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>إضافة/تعديل خدمة / Add/Edit Service</h3>
                <button class="close-modal" onclick="closeModal('service-modal')">&times;</button>
            </div>
            <form id="service-form" onsubmit="saveService(event)">
                <div class="form-grid">
                    <div class="form-group">
                        <label>الاسم بالعربية / Arabic Name</label>
                        <input type="text" id="service-ar" required>
                    </div>
                    <div class="form-group">
                        <label>الاسم بالفرنسية / French Name</label>
                        <input type="text" id="service-fr" required>
                    </div>
                    <div class="form-group">
                        <label>السعر / Price (MRU)</label>
                        <input type="number" id="service-price" required>
                    </div>
                    <div class="form-group">
                        <label>القسم / Category</label>
                        <select id="service-category" required>
                            <option value="nursing">تمريض / Nursing</option>
                            <option value="material">معدات / Material</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>صورة الخدمة / Service Image (URL)</label>
                        <input type="text" id="service-image-url" placeholder="https://...">
                        <input type="file" id="service-file" accept="image/*" style="margin-top: 5px;">
                        <img id="service-preview" src=""
                            style="max-height: 100px; margin-top: 10px; border-radius: 8px; display: none;">
                    </div>
                </div>
                <button type="submit" class="btn-add">حفظ / Save</button>
            </form>
        </div>
    </div>

    <!-- Nurse Modal -->
    <div id="nurse-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>إضافة/تعديل ممرض / Add/Edit Nurse</h3>
                <button class="close-modal" onclick="closeModal('nurse-modal')">&times;</button>
            </div>
            <form id="nurse-form" onsubmit="saveNurse(event)">
                <div class="form-grid">
                    <div class="form-group">
                        <label>الاسم الكامل / Full Name</label>
                        <input type="text" id="nurse-name" required>
                    </div>
                    <div class="form-group">
                        <label>التخصص / Specialty</label>
                        <input type="text" id="nurse-specialty" required>
                    </div>
                    <div class="form-group">
                        <label>الهاتف / Phone</label>
                        <input type="tel" id="nurse-phone" required>
                    </div>

                    <div class="form-group">
                        <label>المنطقة / Region</label>
                        <select id="nurse-region" class="region-select" required>
                            <option value="">اختر المنطقة / Choisir la région</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>صورة الممرض / Nurse Image (URL)</label>
                        <input type="text" id="nurse-image-url" placeholder="https://...">
                        <input type="file" id="nurse-file" accept="image/*" style="margin-top: 5px;">
                        <img id="nurse-preview" src=""
                            style="max-height: 100px; margin-top: 10px; border-radius: 8px; display: none;">
                    </div>

                    <div class="form-group" style="grid-column: span 2;">
                        <label>الموقع الجغرافي / GPS Location</label>
                        <div style="display: flex; gap: 10px; margin-bottom: 8px;">
                            <input type="text" id="nurse-lat" placeholder="Latitude" readonly
                                style="flex: 1; background: #f5f6fa;">
                            <input type="text" id="nurse-lng" placeholder="Longitude" readonly
                                style="flex: 1; background: #f5f6fa;">
                        </div>
                        <button type="button" onclick="getAdminNurseLocation()" class="btn-text"
                            style="width: 100%; border-color: var(--primary); color: var(--primary);">
                            <i class="fa-solid fa-location-crosshairs"></i> تحديد الموقع الحالي / Get Current Location
                        </button>
                    </div>
                </div>
                <button type="submit" class="btn-add">حفظ / Save</button>
            </form>
        </div>
    </div>

    <script src="admin.js"></script>
</body>

</html>
